<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Management System</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --primary:#2563eb; --primary-dark:#1d4ed8; --border:#e2e8f0;
  --success:#16a34a; --danger:#dc2626; --warning:#f59e0b;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8;
    --border:#334155; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8;
  --border:#334155; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0);
  -webkit-tap-highlight-color:transparent;
}
header{
  background:var(--primary); color:#fff;
  padding:14px 16px; font-weight:700; font-size:17px;
  display:flex; justify-content:space-between; align-items:center;
  position:sticky; top:0; z-index:10;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
}
header .h-title{display:flex;align-items:center;gap:8px}
header .h-actions{display:flex;gap:6px}
header button{
  background:rgba(255,255,255,.15); color:#fff; border:0;
  padding:8px 12px; border-radius:8px; font-size:13px;
  font-weight:600; cursor:pointer;
}
header button:active{background:rgba(255,255,255,.3)}

nav{
  display:flex; gap:6px; overflow-x:auto; padding:10px 12px;
  background:var(--card); border-bottom:1px solid var(--border);
  position:sticky; top:calc(52px + env(safe-area-inset-top,0px));
  z-index:9; scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:none; border:1px solid var(--border); background:var(--bg);
  color:var(--text); padding:8px 14px; border-radius:20px;
  font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap;
}
nav button.on{background:var(--primary); color:#fff; border-color:var(--primary)}

main{padding:12px; max-width:1000px; margin:0 auto}

.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:12px}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:10px}

.card{
  background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:14px; margin-bottom:10px;
  box-shadow:var(--shadow);
}
.card h3{
  font-size:15px; margin-bottom:10px; font-weight:700;
  display:flex; justify-content:space-between; align-items:center;
}
.stat{text-align:left}
.stat span{color:var(--muted); font-size:12px; display:block}
.stat b{display:block; font-size:22px; margin-top:4px; font-weight:700}
.pos{color:var(--success)} .neg{color:var(--danger)} .warn{color:var(--warning)}

form{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
label{font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px}
input,select,textarea{
  padding:10px; border:1px solid var(--border); border-radius:8px;
  background:var(--bg); color:var(--text); font-size:15px; width:100%;
  font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary); outline-offset:-1px}
textarea{resize:vertical; min-height:60px}

.btn{
  background:var(--primary); color:#fff; border:0; border-radius:8px;
  padding:11px 16px; font-size:14px; font-weight:600; cursor:pointer;
  align-self:end;
}
.btn:active{background:var(--primary-dark)}
.btn.s{background:var(--bg); color:var(--text); border:1px solid var(--border)}
.btn.d{background:var(--danger)}
.btn.g{background:var(--success)}
.btn.sm{padding:6px 10px; font-size:13px}

.row-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.icon-btn{
  background:none; border:0; cursor:pointer; padding:4px 6px;
  font-size:15px; border-radius:6px; line-height:1;
}
.icon-btn:hover{background:var(--bg)}

.w{overflow-x:auto; margin:0 -14px; padding:0 14px}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th,td{text-align:left; padding:9px 8px; border-bottom:1px solid var(--border); white-space:nowrap}
th{color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.3px}
tbody tr:hover{background:var(--bg)}

.badge{
  display:inline-block; padding:3px 9px; border-radius:10px;
  font-size:11px; font-weight:700; text-transform:uppercase;
}
.badge.paid{background:rgba(22,163,74,.15); color:var(--success)}
.badge.part{background:rgba(245,158,11,.18); color:var(--warning)}
.badge.unpaid{background:rgba(220,38,38,.15); color:var(--danger)}
.badge.left{background:rgba(100,116,139,.18); color:var(--muted)}
.badge.present{background:rgba(22,163,74,.15); color:var(--success)}
.badge.absent{background:rgba(220,38,38,.15); color:var(--danger)}
.badge.leave{background:rgba(245,158,11,.18); color:var(--warning)}

.it{padding:10px 12px; border-radius:8px; margin-bottom:6px; line-height:1.5; font-size:13.5px}
.it small{color:var(--muted); font-size:12px}
.it-paid{background:rgba(22,163,74,.1); border-left:4px solid var(--success)}
.it-part{background:rgba(245,158,11,.12); border-left:4px solid var(--warning)}
.it-unpaid{background:rgba(220,38,38,.1); border-left:4px solid var(--danger)}

.box{background:var(--card); border:2px solid var(--border); border-radius:12px; padding:12px}
.box h3{margin-bottom:8px}
.bx-paid{border-color:var(--success)}
.bx-part{border-color:var(--warning)}
.bx-unpaid{border-color:var(--danger)}

.cb{border:1px dashed var(--border); border-radius:10px; padding:10px; margin-bottom:8px}
.ch{font-weight:700; margin-bottom:6px; font-size:13.5px}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  border-radius:12px; padding:10px 14px; text-align:center;
  font-size:13px; cursor:pointer; font-weight:500;
}
.chip.on{background:var(--primary); color:#fff; border-color:var(--primary)}

.srow{
  padding:10px; border:1px solid var(--border); border-radius:10px;
  margin-bottom:6px; cursor:pointer;
}
.srow.sel{border-color:var(--primary); background:rgba(37,99,235,.08)}

.empty{
  text-align:center; padding:30px 20px; color:var(--muted);
  font-size:13.5px;
}

.modal-bg{
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100;
  display:none; align-items:center; justify-content:center; padding:16px;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--card); border-radius:14px; padding:20px;
  max-width:420px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,.3);
}
.modal h3{margin-bottom:12px; font-size:16px}
.modal p{color:var(--muted); font-size:13.5px; margin-bottom:12px; line-height:1.5}
.modal input{margin-bottom:10px}
.modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:14px}

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px);
  background:var(--text); color:var(--card); padding:12px 20px;
  border-radius:10px; font-size:14px; font-weight:500; z-index:200;
  transition:transform .3s; max-width:90vw;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--success); color:#fff}
.toast.err{background:var(--danger); color:#fff}

.tabs{display:flex; gap:6px; margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:0}
.tabs button{
  background:none; border:0; padding:10px 14px; font-size:14px;
  color:var(--muted); font-weight:600; cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabs button.on{color:var(--primary); border-bottom-color:var(--primary)}

.hint{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5}

@media print{
  header,nav,.del,.no-print,form,.tabs{display:none!important}
  body{background:#fff}
  .card{box-shadow:none; border:1px solid #ccc; page-break-inside:avoid}
  main{padding:0}
}
</style>
</head>
<body>

<header>
  <div class="h-title">🏫 <span>School Management</span></div>
  <div class="h-actions">
    <button onclick="toggleTheme()" title="Theme">🌓</button>
    <button onclick="openSettings()" title="Settings">⚙️</button>
  </div>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<!-- Password Modal -->
<div class="modal-bg" id="pwModal">
  <div class="modal">
    <h3>🔒 Password Required</h3>
    <p id="pwMsg">Enter admin password to confirm this action.</p>
    <input type="password" id="pwInput" placeholder="Enter password" autocomplete="off">
    <div class="modal-actions">
      <button class="btn s" onclick="closePw()">Cancel</button>
      <button class="btn d" onclick="confirmPw()">Confirm</button>
    </div>
  </div>
</div>

<!-- Generic Modal -->
<div class="modal-bg" id="genModal">
  <div class="modal" id="genModalBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ PART 2: CORE LOGIC ============
// ===== CONSTANTS =====
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const today = () => new Date().toISOString().slice(0,10);
const currentMonth = () => MONTHS[new Date().getMonth()] + ' ' + new Date().getFullYear();

const monthList = () => {
  const out = [], now = new Date();
  for (let i = 0; i < 24; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    out.push(MONTHS[d.getMonth()] + ' ' + d.getFullYear());
  }
  return out;
};

// ===== DATABASE =====
const DEFAULT_DB = {
  students: [], fees: [], results: [],
  staff: [], salaries: [], expenses: [],
  attendance: [], tatt: [],
  settings: { password: 'admin123', theme: 'auto', schoolName: 'School Management' },
  deleted: [] // track soft-deleted items
};

let db = JSON.parse(JSON.stringify(DEFAULT_DB));
let toastTimer = null;

function loadDB() {
  try {
    const raw = localStorage.getItem('schoolDB_v2');
    if (raw) {
      const parsed = JSON.parse(raw);
      db = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DB)), parsed);
      if (!db.settings) db.settings = { password: 'admin123', theme: 'auto', schoolName: 'School Management' };
      if (!db.deleted) db.deleted = [];
    }
  } catch(e) { console.warn('DB load failed', e); }
}

function saveDB() {
  try {
    localStorage.setItem('schoolDB_v2', JSON.stringify(db));
    return true;
  } catch(e) {
    toast('Storage full or blocked!', 'err');
    return false;
  }
}

// ===== HELPERS =====
const sum = (arr, key = 'amt') => arr.reduce((s, x) => s + (+x[key] || 0), 0);
const fmt = n => 'Rs ' + Math.round(+n || 0).toLocaleString('en-PK');
const uid = () => Date.now() + Math.floor(Math.random() * 1000);

function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast ' + type, 2200);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== STUDENT / STAFF LOOKUP (includes deleted) =====
function findStudent(id) {
  return db.students.find(s => s.id == id) || null;
}
function findStaff(id) {
  return db.staff.find(s => s.id == id) || null;
}
function studentName(id) {
  const s = findStudent(id);
  return s ? s.name : '—';
}
function staffName(id) {
  const s = findStaff(id);
  return s ? s.name : '—';
}

// ===== SOFT DELETE (marks as deleted, keeps history) =====
function softDelete(entity, id) {
  const arr = db[entity];
  const item = arr.find(x => x.id == id);
  if (!item) return false;
  item.deleted = true;
  item.deletedAt = today();
  // push to deleted log
  db.deleted.push({
    id: uid(),
    entity,
    refId: id,
    name: item.name || item.adm || '—',
    date: today()
  });
  saveDB();
  return true;
}

function restoreItem(entity, id) {
  const arr = db[entity];
  const item = arr.find(x => x.id == id);
  if (!item) return false;
  delete item.deleted;
  delete item.deletedAt;
  db.deleted = db.deleted.filter(d => !(d.entity === entity && d.refId == id));
  saveDB();
  return true;
}

// ===== FEE STATUS =====
function feeStatus(student, month) {
  if (!student) return 'unpaid';
  const paid = sum(db.fees.filter(f => f.sid == student.id && f.month == month));
  const fee = +student.fee || 0;
  if (fee > 0 && paid >= fee) return 'paid';
  if (paid > 0) return 'part';
  return 'unpaid';
}

function feeBadge(status) {
  const labels = { paid: 'Paid', part: 'Partial', unpaid: 'Unpaid' };
  return `<span class="badge ${status}">${labels[status] || status}</span>`;
}

// ===== PASSWORD =====
let pendingAction = null;

function requirePassword(message, callback) {
  pendingAction = callback;
  document.getElementById('pwMsg').textContent = message || 'Enter admin password to continue.';
  document.getElementById('pwInput').value = '';
  document.getElementById('pwModal').classList.add('show');
  setTimeout(() => document.getElementById('pwInput').focus(), 100);
}

function closePw() {
  document.getElementById('pwModal').classList.remove('show');
  pendingAction = null;
}

function confirmPw() {
  const entered = document.getElementById('pwInput').value;
  const correct = db.settings.password || 'admin123';
  if (entered === correct) {
    document.getElementById('pwModal').classList.remove('show');
    const cb = pendingAction;
    pendingAction = null;
    if (cb) cb();
  } else {
    toast('Wrong password!', 'err');
    document.getElementById('pwInput').value = '';
  }
}

// ===== THEME =====
function toggleTheme() {
  const cur = db.settings.theme || 'auto';
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'auto' : 'dark';
  db.settings.theme = next;
  applyTheme();
  saveDB();
  toast('Theme: ' + next);
}

function applyTheme() {
  const t = db.settings.theme || 'auto';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}

// ===== SETTINGS MODAL =====
function openSettings() {
  const s = db.settings;
  document.getElementById('genModalBody').innerHTML = `
    <h3>⚙️ Settings</h3>
    <label style="margin-bottom:8px">School Name
      <input id="setName" value="${escapeHtml(s.schoolName || '')}">
    </label>
    <label style="margin-bottom:8px">Admin Password (for delete actions)
      <input id="setPw" type="text" value="${escapeHtml(s.password || '')}">
    </label>
    <label style="margin-bottom:8px">Theme
      <select id="setTheme">
        <option value="auto" ${s.theme==='auto'?'selected':''}>Auto (System)</option>
        <option value="light" ${s.theme==='light'?'selected':''}>Light</option>
        <option value="dark" ${s.theme==='dark'?'selected':''}>Dark</option>
      </select>
    </label>
    <hr style="border:0;border-top:1px solid var(--border);margin:14px 0">
    <p class="hint">Backup & Restore your data:</p>
    <div class="row-actions">
      <button class="btn sm" onclick="exportBackup()">⬇ Backup (JSON)</button>
      <label class="btn s sm" style="display:inline-flex;align-items:center;cursor:pointer">
        ⬆ Restore<input type="file" accept=".json" style="display:none" onchange="importBackup(this)">
      </label>
    </div>
    <hr style="border:0;border-top:1px solid var(--border);margin:14px 0">
    <p class="hint">Danger zone (password required):</p>
    <button class="btn d sm" onclick="clearAllData()">🗑 Clear All Data</button>
    <div class="modal-actions">
      <button class="btn s" onclick="closeGen()">Close</button>
      <button class="btn" onclick="saveSettings()">Save Settings</button>
    </div>
  `;
  document.getElementById('genModal').classList.add('show');
}

function closeGen() {
  document.getElementById('genModal').classList.remove('show');
}

function saveSettings() {
  db.settings.schoolName = document.getElementById('setName').value.trim() || 'School Management';
  db.settings.password = document.getElementById('setPw').value || 'admin123';
  db.settings.theme = document.getElementById('setTheme').value;
  applyTheme();
  saveDB();
  closeGen();
  toast('Settings saved', 'ok');
  render();
}

function exportBackup() {
  const data = JSON.stringify(db, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'school-backup-' + today() + '.json';
  a.click();
  toast('Backup downloaded', 'ok');
}

function importBackup(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!confirm('This will replace ALL current data. Continue?')) return;
      db = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DB)), data);
      if (!db.deleted) db.deleted = [];
      saveDB();
      applyTheme();
      closeGen();
      render();
      toast('Data restored', 'ok');
    } catch(e) {
      toast('Invalid backup file', 'err');
    }
  };
  reader.readAsText(file);
}

function clearAllData() {
  requirePassword('Enter password to CLEAR ALL data. This cannot be undone!', () => {
    if (!confirm('Are you absolutely sure? All records will be lost.')) return;
    db = JSON.parse(JSON.stringify(DEFAULT_DB));
    saveDB();
    applyTheme();
    render();
    toast('All data cleared', 'ok');
  });
}

// ===== FORM HELPERS =====
function addRecord(entity, data) {
  const rec = { id: uid(), ...data };
  db[entity].push(rec);
  saveDB();
  return rec;
}

function updateRecord(entity, id, data) {
  const item = db[entity].find(x => x.id == id);
  if (!item) return false;
  Object.assign(item, data);
  saveDB();
  return true;
}

// ===== LOAD ON START =====
loadDB();
applyTheme();
// ============ PART 3: UI RENDERING ============

let activeTab = 'dashboard';
let sm = currentMonth();
let feeClass = '', feeStudent = '', feeSearch = '';
let resClass = '', resStudent = '';
let attType = 'student', attDate = today(), attClass = '';
let editing = null;

const TABS = [
  ['dashboard', '📊 Dashboard'],
  ['students', '🎓 Students'],
  ['fees', '💰 Fees'],
  ['results', '📝 Results'],
  ['attendance', '✅ Attendance'],
  ['staff', '👨‍🏫 Staff'],
  ['salaries', '💵 Salaries'],
  ['expenses', '🧾 Expenses'],
  ['reports', '📈 Reports']
];

function renderNav() {
  document.getElementById('nav').innerHTML = TABS.map(([k, l]) =>
    `<button class="${activeTab === k ? 'on' : ''}" onclick="switchTab('${k}')">${l}</button>`
  ).join('');
}

function switchTab(k) {
  activeTab = k;
  editing = null;
  render();
}

function render() {
  renderNav();
  const main = document.getElementById('main');
  const fns = {
    dashboard: renderDashboard,
    students: renderStudents,
    fees: renderFees,
    results: renderResults,
    attendance: renderAttendance,
    staff: renderStaff,
    salaries: renderSalaries,
    expenses: renderExpenses,
    reports: renderReports
  };
  main.innerHTML = (fns[activeTab] || renderDashboard)();
}

// ===== DASHBOARD =====
function renderDashboard() {
  const totalFees = sum(db.fees);
  const totalSalaries = sum(db.salaries);
  const totalExpenses = sum(db.expenses);
  const balance = totalFees - totalSalaries - totalExpenses;
  const activeStudents = db.students.filter(s => !s.deleted).length;
  const activeStaff = db.staff.filter(s => !s.deleted).length;
  const paidThisMonth = db.students.filter(s => !s.deleted && feeStatus(s, currentMonth()) === 'paid').length;
  const unpaidThisMonth = db.students.filter(s => !s.deleted && feeStatus(s, currentMonth()) !== 'paid').length;
  const monthFees = sum(db.fees.filter(f => f.month === currentMonth()));
  const expectedFees = sum(db.students.filter(s => !s.deleted), 'fee');

  const stats = [
    ['Active Students', activeStudents, ''],
    ['Active Staff', activeStaff, ''],
    ['Paid This Month', paidThisMonth, 'pos'],
    ['Unpaid This Month', unpaidThisMonth, 'neg'],
    ['Total Fees Collected', fmt(totalFees), 'pos'],
    ['This Month Fees', `${fmt(monthFees)} / ${fmt(expectedFees)}`, ''],
    ['Total Salaries Paid', fmt(totalSalaries), ''],
    ['Total Expenses', fmt(totalExpenses), ''],
    ['Net Balance', fmt(balance), balance >= 0 ? 'pos' : 'neg']
  ];

  const cls = {};
  db.students.filter(s => !s.deleted).forEach(s => {
    const c = s.cls || 'Unassigned';
    cls[c] = (cls[c] || 0) + 1;
  });

  return `
    <div class="grid">
      ${stats.map(([l, v, c]) => `
        <div class="card stat">
          <span>${l}</span>
          <b class="${c}">${v}</b>
        </div>
      `).join('')}
    </div>
    <div class="card">
      <h3>Students by Class</h3>
      ${Object.keys(cls).length
        ? Object.entries(cls).sort().map(([c, n]) => `<b>${escapeHtml(c)}</b>: ${n}`).join(' &nbsp;·&nbsp; ')
        : '<div class="empty">No students added yet</div>'}
    </div>
  `;
}

// ===== STUDENTS =====
const STUDENT_FIELDS = [
  ['adm', 'Admission No.', 'text'],
  ['name', 'Full Name', 'text'],
  ['father', 'Father Name', 'text'],
  ['mother', 'Mother Name', 'text'],
  ['cls', 'Class', 'text'],
  ['roll', 'Roll No.', 'text'],
  ['phone', 'Phone', 'text'],
  ['addr', 'Address', 'text'],
  ['fee', 'Monthly Fee', 'number'],

      if (ca !== cb) return ca.localeCompare(cb, undefined, { numeric: true });
      return (+a.roll || 0) - (+b.roll || 0);

  const editData = editing && editing.entity === 'students'
    ? db.students.find(s => s.id == editing.id) : null;

            <input name="${f}" type="${t}" ${t === 'number' ? 'step="any"' : ''}
              value="${editData ? escapeHtml(editData[f] || '') : (f === 'date' ? today() : '')}"

        <td>${escapeHtml(s.adm || '')}</td>
        <td>${escapeHtml(s.name || '')}</td>
        <td>${escapeHtml(s.cls || '')}</td>
        <td>${escapeHtml(s.roll || '')}</td>

      <h3>Students List (${students.length})</h3>
      <div class="w">
        <table>
          <thead>
            <tr>
              <th>Adm No.</th><th>Name</th><th>Class</th><th>Roll</th>
              <th>Phone</th><th>Fee</th><th>Status</th><th>Actions</th>
            </tr>

            ${rows || `<tr><td colspan="8" class="empty">No students yet. Add your first student above.</td></tr>`}
          </tbody>
        </table>
      </div>

    </div>
  `;
}

function saveStudent(e) {

function renderFees() {
  const activeStudents = db.students.filter(s => !s.deleted);

      `).join('') || '<div class="empty">Add students first</div>'}

            <b>Roll ${escapeHtml(s.roll || '—')}</b> · Adm ${escapeHtml(s.adm || '—')} ${feeBadge(feeStatus(s, currentMonth()))}
            <br>${escapeHtml(s.name)} <small style="color:var(--muted)">(Father: ${escapeHtml(s.father || '—')})</small>
          </div>
        `).join('') || '<div class="empty">No match found</div>'}
      </div>
    </div>`;

  const st = db.students.find(s => s.id == feeStudent);
  if (st) {
    const myFees = db.fees.filter(f => f.sid == st.id);
    html += `<div class="card">
      <h3>Step 3: Add Fee Payment</h3>
      <p style="margin-bottom:10px">
        <b>${escapeHtml(st.name)}</b> (Father: ${escapeHtml(st.father || '—')})<br>
        <small style="color:var(--muted)">Class ${escapeHtml(st.cls || '—')} · Roll ${escapeHtml(st.roll || '—')} · Monthly Fee ${fmt(st.fee)}</small><br>

      </p>
      <form onsubmit="saveFee(event)">
        <label>Month
          <select name="month">${monthList().map(m => `<option>${m}</option>`).join('')}</select>
        </label>
        <label>Amount<input name="amt" type="number" step="any" value="${st.fee || ''}" required></label>
        <label>Date<input name="date" type="date" value="${today()}"></label>
        <label>Method
          <select name="method">
            <option>Cash</option><option>Bank</option><option>Online</option><option>Cheque</option>
          </select>
        </label>
        <label>Receipt No.<input name="receipt" value="R-${Date.now().toString().slice(-6)}"></label>
        <label>Note<input name="note" placeholder="Optional"></label>
        <div class="row-actions" style="grid-column:1/-1">
          <button class="btn">💰 Save Payment</button>
        </div>
      </form>
    </div>`;
  }

  const filteredFees = db.fees.filter(f => {
    if (!feeClass) return true;
    const s = findStudent(f.sid);
    return s && (s.cls || 'Unassigned') === feeClass;
  });

  html += `<div class="card">
    <h3>Fee Records ${feeClass ? '— Class ' + escapeHtml(feeClass) : ''}</h3>
    <p style="margin-bottom:8px"><b>Total: ${fmt(sum(filteredFees))}</b></p>
    <div class="w">
      <table>
        <thead>
          <tr><th>Receipt</th><th>Student</th><th>Month</th><th>Amount</th><th>Method</th><th>Date</th><th>Actions</th></tr>
        </thead>
        <tbody>
          ${filteredFees.slice().reverse().map(f => {
            const s = findStudent(f.sid) || {};
            return `
              <tr>
                <td>${escapeHtml(f.receipt || '—')}</td>

    toast('Fee saved', 'ok');

  render();

function editFee(id) {
  const f = db.fees.find(x => x.id == id);
  if (!f) return;
  editing = { entity: 'fees', id };

  feeClass = (findStudent(f.sid) || {}).cls || '';

  if (month === null) { editing = null; return; }

  editing = null;
  toast('Fee updated', 'ok');
  render();
}

function deleteFee(id) {

    toast('Fee record deleted', 'ok');

      `).join('')}
    </div>`;
  }

  const st = db.students.find(s => s.id == resStudent);
  if (st) {
    html += `<div class="card">
      <h3>Step 3: Add Result</h3>
      <p style="margin-bottom:10px"><b>${escapeHtml(st.name)}</b> — Class ${escapeHtml(st.cls || '—')}</p>
      <form onsubmit="saveResult(event)">
        <label>Exam
          <select name="exam">
            <option>Monthly Test</option><option>Mid Term</option>
            <option>Final Term</option><option>Annual</option>
          </select>

        <label>Subject<input name="sub" required placeholder="e.g. Math"></label>

        <label>Total Marks<input name="tot" type="number" step="any" required></label>
        <div class="row-actions" style="grid-column:1/-1">
          <button class="btn">📝 Add Subject Result</button>
        </div>
      </form>
    </div>`;
  }

  const filtered = db.results.filter(r => {
    const s = findStudent(r.sid);
    if (!s) return false;
    if (resClass && (s.cls || 'Unassigned') !== resClass) return false;
    return true;
  });

  const grouped = {};
  filtered.forEach(r => {
    const key = `${r.sid}|${r.exam}|${r.year || ''}`;
    if (!grouped[key]) grouped[key] = { sid: r.sid, exam: r.exam, year: r.year, rows: [] };
    grouped[key].rows.push(r);
  });

  html += `<h3 style="margin:14px 4px 8px;font-size:15px">Results ${resClass ? '— Class ' + escapeHtml(resClass) : '(All Classes)'}</h3>`;
  html += Object.values(grouped).map(g => {
    const s = findStudent(g.sid) || {};
    const got = sum(g.rows, 'got'), tot = sum(g.rows, 'tot');
    const pct = tot ? (got / tot * 100).toFixed(1) : 0;
    return `<div class="card">
      <b>${escapeHtml(s.name || '—')}</b> <small style="color:var(--muted)">(Roll ${escapeHtml(s.roll || '—')}, Class ${escapeHtml(s.cls || '—')})</small><br>
      <small style="color:var(--muted)">${escapeHtml(g.exam)} · Year ${escapeHtml(g.year || '—')}</small>
      <div class="w" style="margin-top:8px">
        <table>
          <thead><tr><th>Subject</th><th>Obtained</th><th>Total</th><th>%</th><th></th></tr></thead>
          <tbody>
            ${g.rows.map(y => `
              <tr>
                <td>${escapeHtml(y.sub)}</td>
                <td>${y.got}</td>
                <td>${y.tot}</td>
                <td>${y.tot ? (y.got / y.tot * 100).toFixed(1) : 0}%</td>
                <td><button class="icon-btn" onclick="deleteResult(${y.id})">🗑️</button></td>
              </tr>
            `).join('')}
            <tr><th>Total</th><th>${got}</th><th>${tot}</th><th>${pct}%</th><th></th></tr>
          </tbody>
        </table>
      </div>
    </div>`;
  }).join('') || '<div class="card"><div class="empty">No results yet</div></div>';

  return html;
}

// ===== ATTENDANCE =====
function renderAttendance() {
  const isStudent = attType === 'student';
  const people = isStudent ? db.students.filter(s => !s.deleted) : db.staff.filter(s => !s.deleted);
  const classes = {};
  if (isStudent) {
    people.forEach(s => {
      const c = s.cls || 'Unassigned';
      (classes[c] = classes[c] || []).push(s);
    });
  }

  const getAtt = (id) => db[isStudent ? 'attendance' : 'tatt'].find(a => a.date === attDate && (isStudent ? a.sid == id : a.tid == id));

  const setAtt = (id, status) => {
    const arr = db[isStudent ? 'attendance' : 'tatt'];
    const rec = arr.find(a => a.date === attDate && (isStudent ? a.sid == id : a.tid == id));
    if (rec) rec.st = status;
    else arr.push({ id: uid(), [isStudent ? 'sid' : 'tid']: id, date: attDate, st: status });
    saveDB();
    render();
  };

  const markAll = (ids, status) => {
    const arr = db[isStudent ? 'attendance' : 'tatt'];
    ids.forEach(id => {
      const rec = arr.find(a => a.date === attDate && (isStudent ? a.sid == id : a.tid == id));
      if (rec) rec.st = status;
      else arr.push({ id: uid(), [isStudent ? 'sid' : 'tid']: id, date: attDate, st: status });
    });
    saveDB();
    render();
  };

  const buttons = (id) => {
    const cur = (getAtt(id) || {}).st;
    return `<div class="row-actions">
      ${[['Present','paid'],['Absent','unpaid'],['Leave','part']].map(([t, cls]) => `
        <button class="icon-btn badge ${cur === t ? cls : ''}" style="font-size:12px;padding:5px 10px" onclick="setAtt_${isStudent ? 's' : 't'}(${id},'${t}')">${t}</button>
      `).join('')}
    </div>`;
  };

  let html = `<div class="card">
    <div class="tabs">
      <button class="${isStudent ? 'on' : ''}" onclick="attType='student';render()">🎓 Students</button>
      <button class="${!isStudent ? 'on' : ''}" onclick="attType='staff';render()">👨‍🏫 Staff</button>
    </div>
    <label style="margin-top:10px">Date
      <input type="date" value="${attDate}" onchange="attDate=this.value;render()">
    </label>
  </div>`;

  if (isStudent) {
    const classNames = Object.keys(classes).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    html += `<div class="card">
      <h3>Select Class</h3>
      <div class="chips">
        ${classNames.map(c => `
          <button class="chip ${c === attClass ? 'on' : ''}" onclick="attClass='${c.replace(/'/g, "\\'")}';render()">Class ${escapeHtml(c)}</button>
        `).join('') || '<div class="empty">No students</div>'}
      </div>
    </div>`;

    if (attClass && classes[attClass]) {
      const list = classes[attClass].slice().sort((a, b) => (+a.roll || 0) - (+b.roll || 0));
      const statuses = list.map(s => (getAtt(s.id) || {}).st);
      const counts = {
        Present: statuses.filter(x => x === 'Present').length,
        Absent: statuses.filter(x => x === 'Absent').length,
        Leave: statuses.filter(x => x === 'Leave').length
      };
      html += `<div class="card">
        <h3>Class ${escapeHtml(attClass)} — ${attDate}</h3>
        <p style="margin-bottom:10px">
          <span class="badge paid">Present: ${counts.Present}</span>
          <span class="badge unpaid">Absent: ${counts.Absent}</span>
          <span class="badge part">Leave: ${counts.Leave}</span>
        </p>
        <button class="btn sm g" onclick="markAllStudents([${list.map(s => s.id).join(',')}],'Present')">✅ All Present</button>
        <div style="margin-top:10px">
          ${list.map(s => `
            <div class="srow">
              <b>Roll ${escapeHtml(s.roll || '—')}</b> · ${escapeHtml(s.name)}
              ${buttons(s.id)}
            </div>
          `).join('')}
        </div>
      </div>`;
    }
  } else {
    html += `<div class="card">
      <h3>Staff Attendance — ${attDate}</h3>
      ${people.length ? `<button class="btn sm g" onclick="markAllStaff([${people.map(s => s.id).join(',')}],'Present')">✅ All Present</button>` : ''}
      <div style="margin-top:10px">
        ${people.map(t => `
          <div class="srow">
            <b>${escapeHtml(t.name)}</b> <small style="color:var(--muted)">${escapeHtml(t.role || '')}</small>
            ${buttons(t.id)}
          </div>
        `).join('') || '<div class="empty">No staff added</div>'}
      </div>
    </div>`;
  }

  // Expose helpers to global for inline onclick
  window.setAtt_s = setAtt;
  window.setAtt_t = setAtt;
  window.markAllStudents = markAll;
  window.markAllStaff = markAll;

  return html;
}

// ===== SALARIES =====
function renderSalaries() {
  const activeStaff = db.staff.filter(s => !s.deleted);
  let html = `<div class="card">
    <h3>➕ Pay Salary</h3>
    <form onsubmit="saveSalary(event)">
      <label>Staff
        <select name="tid" required>
          ${activeStaff.map(s => `<option value="${s.id}">${escapeHtml(s.name)} (${escapeHtml(s.role || '')})</option>`).join('')}
        </select>
      </label>
      <label>Month<select name="month">${monthList().map(m => `<option>${m}</option>`).join('')}</select></label>
      <label>Amount<input name="amt" type="number" step="any" required></label>
      <label>Date<input name="date" type="date" value="${today()}"></label>
      <label>Method<select name="method"><option>Cash</option><option>Bank</option><option>Online</option></select></label>
      <div class="row-actions" style="grid-column:1/-1">
        <button class="btn">💵 Save Salary</button>
      </div>
    </form>
  </div>`;

  const records = db.salaries.slice().reverse();
  html += `<div class="card">
    <h3>Salary Records</h3>
    <p style="margin-bottom:8px"><b>Total: ${fmt(sum(db.salaries))}</b></p>
    <div class="w">
      <table>
        <thead><tr><th>Staff</th><th>Month</th><th>Amount</th><th>Method</th><th>Date</th><th>Actions</th></tr></thead>
        <tbody>
          ${records.map(s => {
            const t = findStaff(s.tid) || {};
            return `<tr>
              <td>${escapeHtml(t.name || '—')}${t.deleted ? ' <span class="badge left">Left</span>' : ''}</td>
              <td>${escapeHtml(s.month || '')}</td>
              <td>${fmt(s.amt)}</td>
              <td>${escapeHtml(s.method || '')}</td>
              <td>${escapeHtml(s.date || '')}</td>
              <td>
                <button class="icon-btn" onclick="editSalary(${s.id})">✏️</button>
                <button class="icon-btn" onclick="deleteSalary(${s.id})">🗑️</button>
              </td>
            </tr>`;
          }).join('') || `<tr><td colspan="6" class="empty">No salary records</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;

  return html;
}

function saveSalary(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = {};
  fd.forEach((v, k) => data[k] = v);
  addRecord('salaries', data);
  toast('Salary saved', 'ok');
  e.target.reset();
  render();
}

function editSalary(id) {
  const s = db.salaries.find(x => x.id == id);
  if (!s) return;
  const amt = prompt('Amount:', s.amt); if (amt === null) return;
  const month = prompt('Month:', s.month); if (month === null) return;
  const date = prompt('Date:', s.date); if (date === null) return;
  updateRecord('salaries', id, { amt, month, date });
  toast('Salary updated', 'ok');
  render();
}

function deleteSalary(id) {
  requirePassword('Enter password to delete this salary record.', () => {
    db.salaries = db.salaries.filter(x => x.id != id);
    saveDB();
    toast('Salary record deleted', 'ok');
    render();
  });
}

// ===== EXPENSES =====
const EXPENSE_CATS = ['Building Maintenance','Utilities (Electricity/Water/Gas)','Stationery','Books','Furniture','Transport','Events','Salary Advance','Other'];

function renderExpenses() {
  let html = `<div class="card">
    <h3>➕ Add Expense</h3>
    <form onsubmit="saveExpense(event)">
      <label>Category
        <select name="cat" onchange="document.getElementById('otherCat').style.display=this.value==='Other'?'flex':'none'">
          ${EXPENSE_CATS.map(c => `<option>${c}</option>`).join('')}
        </select>
      </label>
      <label id="otherCat" style="display:none">Other Category<input name="catOther"></label>
      <label>Description<input name="desc" required></label>
      <label>Amount<input name="amt" type="number" step="any" required></label>
      <label>Date<input name="date" type="date" value="${today()}"></label>
      <label>Paid By<input name="by" placeholder="Optional"></label>
      <div class="row-actions" style="grid-column:1/-1">
        <button class="btn">🧾 Save Expense</button>
      </div>
    </form>
  </div>`;

  const records = db.expenses.slice().reverse();
  html += `<div class="card">
    <h3>Expense Records</h3>
    <p style="margin-bottom:8px"><b>Total: ${fmt(sum(db.expenses))}</b></p>
    <div class="w">
      <table>
        <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Paid By</th><th>Actions</th></tr></thead>
        <tbody>
          ${records.map(e => `
            <tr>
              <td>${escapeHtml(e.date || '')}</td>
              <td>${escapeHtml(e.cat || '')}</td>
              <td>${escapeHtml(e.desc || '')}</td>
              <td>${fmt(e.amt)}</td>
              <td>${escapeHtml(e.by || '')}</td>
              <td>
                <button class="icon-btn" onclick="editExpense(${e.id})">✏️</button>
                <button class="icon-btn" onclick="deleteExpense(${e.id})">🗑️</button>
              </td>
            </tr>
          `).join('') || `<tr><td colspan="6" class="empty">No expenses</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;

  return html;
}

function saveExpense(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = {};
  fd.forEach((v, k) => data[k] = v);
  if (data.catOther && data.cat === 'Other') { data.cat = data.catOther; delete data.catOther; }
  addRecord('expenses', data);
  toast('Expense saved', 'ok');
  e.target.reset();
  render();
}

function editExpense(id) {
  const e = db.expenses.find(x => x.id == id);
  if (!e) return;
  const amt = prompt('Amount:', e.amt); if (amt === null) return;
  const desc = prompt('Description:', e.desc); if (desc === null) return;
  const date = prompt('Date:', e.date); if (date === null) return;
  updateRecord('expenses', id, { amt, desc, date });
  toast('Expense updated', 'ok');
  render();
}

function deleteExpense(id) {
  requirePassword('Enter password to delete this expense.', () => {
    db.expenses = db.expenses.filter(x => x.id != id);
    saveDB();
    toast('Expense deleted', 'ok');
    render();
  });
}

// ===== REPORTS =====
function renderReports() {
  const month = sm;
  const monthFees = db.fees.filter(f => f.month === month);
  const monthSalaries = db.salaries.filter(s => s.month === month);
  const monthExpenses = db.expenses.filter(e => (e.date || '').startsWith(monthYearPrefix(month)));

  const income = sum(monthFees);
  const salaryOut = sum(monthSalaries);
  const expOut = sum(monthExpenses);
  const net = income - salaryOut - expOut;

  const expenseByCat = {};
  monthExpenses.forEach(e => expenseByCat[e.cat] = (expenseByCat[e.cat] || 0) + (+e.amt || 0));

  const pending = db.students.filter(s => !s.deleted).map(s => {
    const paid = sum(db.fees.filter(f => f.sid == s.id && f.month === month));
    const fee = +s.fee || 0;
    return { s, paid, due: Math.max(0, fee - paid) };
  }).filter(x => x.due > 0);

  const deletedList = db.students.filter(s => s.deleted).map(s => {
    const paid = sum(db.fees.filter(f => f.sid == s.id));
    return { name: s.name, cls: s.cls, paid, deletedAt: s.deletedAt };
  });

  const deletedStaffList = db.staff.filter(s => s.deleted).map(s => {
    const paid = sum(db.salaries.filter(x => x.tid == s.id));
    return { name: s.name, role: s.role, paid, deletedAt: s.deletedAt };
  });

  return `
    <div class="card no-print">
      <label>Select Month
        <select onchange="sm=this.value;render()">
          ${monthList().map(m => `<option ${m === sm ? 'selected' : ''}>${m}</option>`).join('')}
        </select>
      </label>
      <div class="row-actions">
        <button class="btn" onclick="window.print()">🖨 Print Report</button>
      </div>
    </div>

    <div class="grid">
      <div class="card stat"><span>Income (Fees)</span><b class="pos">${fmt(income)}</b></div>
      <div class="card stat"><span>Salaries Paid</span><b class="neg">${fmt(salaryOut)}</b></div>
      <div class="card stat"><span>Expenses</span><b class="neg">${fmt(expOut)}</b></div>
      <div class="card stat"><span>Net Balance</span><b class="${net >= 0 ? 'pos' : 'neg'}">${fmt(net)}</b></div>
    </div>

    <div class="card">
      <h3>Pending Fees — ${escapeHtml(month)}</h3>
      <div class="w">
        <table>
          <thead><tr><th>Name</th><th>Class</th><th>Fee</th><th>Paid</th><th>Due</th></tr></thead>
          <tbody>
            ${pending.map(x => `
              <tr>
                <td>${escapeHtml(x.s.name)}</td>
                <td>${escapeHtml(x.s.cls || '')}</td>
                <td>${fmt(x.s.fee)}</td>
                <td>${fmt(x.paid)}</td>
                <td class="neg">${fmt(x.due)}</td>
              </tr>
            `).join('') || `<tr><td colspan="5" class="empty">All fees cleared ✅</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>Expenses by Category — ${escapeHtml(month)}</h3>
      ${Object.keys(expenseByCat).length
        ? Object.entries(expenseByCat).map(([c, v]) => `<div style="padding:6px 0;border-bottom:1px solid var(--border)">${escapeHtml(c)}: <b>${fmt(v)}</b></div>`).join('')
        : '<div class="empty">No expenses this month</div>'}
    </div>

    <div class="card">
      <h3>Former Students (History Preserved)</h3>
      <div class="w">
        <table>
          <thead><tr><th>Name</th><th>Class</th><th>Total Paid</th><th>Left On</th></tr></thead>
          <tbody>
            ${deletedList.map(x => `
              <tr>
                <td>${escapeHtml(x.name)}</td>
                <td>${escapeHtml(x.cls || '')}</td>
                <td>${fmt(x.paid)}</td>
                <td>${escapeHtml(x.deletedAt || '')}</td>
              </tr>
            `).join('') || `<tr><td colspan="4" class="empty">No former students</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>Former Staff (History Preserved)</h3>
      <div class="w">
        <table>
          <thead><tr><th>Name</th><th>Role</th><th>Total Salary Paid</th><th>Left On</th></tr></thead>
          <tbody>
            ${deletedStaffList.map(x => `
              <tr>
                <td>${escapeHtml(x.name)}</td>
                <td>${escapeHtml(x.role || '')}</td>
                <td>${fmt(x.paid)}</td>
                <td>${escapeHtml(x.deletedAt || '')}</td>
              </tr>
            `).join('') || `<tr><td colspan="4" class="empty">No former staff</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card no-print">
      <h3>Backup & Restore</h3>
      <div class="row-actions">
        <button class="btn" onclick="exportBackup()">⬇ Download Backup</button>
      </div>
    </div>
  `;
}

function monthYearPrefix(monthLabel) {
  // "Jan 2025" -> "2025-01"
  const [m, y] = monthLabel.split(' ');
  const idx = MONTHS.indexOf(m) + 1;
  return y + '-' + String(idx).padStart(2, '0');
}

// ===== INITIAL RENDER =====
render();
</script>

</body>
</html>
